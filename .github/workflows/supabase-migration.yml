name: Run Supabase Migration

on:
  push:
    branches:
      - main
      - remove-supplier-sku-modal
    paths:
      - 'supabase/migrations/*.sql'
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Specific migration file to run (optional)'
        required: false
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        run: |
          curl -sL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          chmod +x /tmp/supabase
          echo "/tmp" >> $GITHUB_PATH

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Linking to project: $SUPABASE_PROJECT_REF"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_ACCESS_TOKEN" || true

      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "${{ inputs.migration_file }}" ]; then
            echo "Running specific migration: ${{ inputs.migration_file }}"
            supabase db push --db-url "postgresql://postgres.[$SUPABASE_PROJECT_REF]:$SUPABASE_DB_PASSWORD@aws-0-[$SUPABASE_PROJECT_REF].pooler.supabase.com:5432/postgres" --file "supabase/migrations/${{ inputs.migration_file }}"
          else
            echo "Running all pending migrations..."
            supabase db push --db-url "postgresql://postgres.[$SUPABASE_PROJECT_REF]:$SUPABASE_DB_PASSWORD@aws-0-[$SUPABASE_PROJECT_REF].pooler.supabase.com:5432/postgres"
          fi

      - name: Show migration status
        if: always()
        run: |
          supabase migration list || echo "Migration list not available"
